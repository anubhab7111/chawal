# swaync started by D-Bus activation (after a crash, say) gets what the
# autostart one gets in config-hypr modules/autostart.lua: GTK's own blur
# protocol off, so Hyprland's layer rules blur the toasts (config-swaync
# style.css says why).
[Service]
Environment=GDK_WAYLAND_DISABLE=ext_background_effect_manager_v1
