# Catppuccin Latte palette for the native tmux bar. rice-theme links this to
# ~/.config/tmux/colors.conf, which tmux.conf sources.
set -g @thm_crust    "#dce0e8"
set -g @thm_mantle   "#e6e9ef"
set -g @thm_base     "#eff1f5"
set -g @thm_surface0 "#ccd0da"
set -g @thm_surface1 "#bcc0cc"
set -g @thm_overlay0 "#9ca0b0"
set -g @thm_subtext0 "#6c6f85"
set -g @thm_text     "#4c4f69"
set -g @thm_blue     "#1e66f5"
set -g @thm_mauve    "#8839ef"
set -g @thm_peach    "#fe640b"
set -g @thm_green    "#40a02b"
set -g @thm_yellow   "#df8e1d"
