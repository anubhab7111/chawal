# petabyte lock-screen wording — distinct tone from the baseline, same
# playful spirit, nothing explicit. Split around $USER (rather than
# embedding $USER inside these vars) since $USER is only proven to resolve
# when used directly in a hyprlock.conf property, not when nested inside
# another variable's own definition.
$lockGreetingPrefix = Miss me already,
$lockGreetingSuffix = ?
$lockPlaceholder = Whisper the password...
$lockFailText = Mm, wrong. Try again, slower.
$lockUptimeCmd = echo "󱑎 Been yours for $(uptime -p | sed 's/up //')"
