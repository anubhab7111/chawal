# ================================
# FONT CONFIGURATION
# ================================
font=JetBrainsMono Nerd Font 13
markup=1

# ================================
# GLOBAL CONFIG
# ================================
max-history=50
sort=-time
layer=overlay
anchor=top-right

# ================================
# BINDING OPTIONS
# ================================
on-button-middle=exec makoctl menu -n "$id" dmenu -p 'Select action: '
on-button-right=dismiss
on-touch=dismiss
on-notify=exec mpv /usr/share/sounds/freedesktop/stereo/message.oga

# ================================
# STYLE OPTIONS
# ================================
# Dimensions & Spacing
width=400
height=120
margin=12
padding=16,20
icon-location=left
max-icon-size=48

# Visibility & Behavior
default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name

# ================================
# COLORS & APPEARANCE
# ================================
background-color=#2b1620f2
text-color=#f5dde3
border-color=#c9a8e0
border-size=3
border-radius=16
icon-path=/usr/share/icons/Papirus-Dark

# Progress bar styling
progress-color=over #c9a8e0

# ================================
# EFFECTS & ANIMATIONS
# ================================
# Note: Mako doesn't support blur natively, but compositor handles it

# ================================
# URGENCY LEVELS
# ================================
[urgency=low]
border-color=#7fd8c4
background-color=#2b1620f2
default-timeout=3000

[urgency=normal]
border-color=#c9a8e0
background-color=#2b1620f2
default-timeout=5000

[urgency=high]
border-color=#ff2d55
background-color=#2b1620f2
text-color=#ff2d55
default-timeout=0

[urgency=critical]
border-color=#ff2d55
background-color=#1a0e14f2
text-color=#ff2d55
default-timeout=0
border-size=4

# ================================
# APP-SPECIFIC OVERRIDES
# ================================
[app-name="Spotify"]
border-color=#8fd6a8
icon-path=/usr/share/icons/Papirus-Dark

[app-name="Volume" app-name="Brightness"]
border-color=#ff7d96
default-timeout=2000
group-by=none

[app-name="Network"]
border-color=#ff4d6d

[app-name="Battery"]
border-color=#8fd6a8

[app-name="screenshot"]
border-color=#8fc7e0
default-timeout=2000
