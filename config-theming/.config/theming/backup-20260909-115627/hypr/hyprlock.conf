source = $HOME/.config/hypr/configs/mocha.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = JetBrainsMono Nerd Font

# General settings
general {
    hide_cursor = true
    # grace = 2
}

# Background configuration
background {
    monitor =
    path = screenshot
    color = $base

    blur_size = 4
    blur_passes = 2
    noise = 0.015
    contrast = 0.92
    brightness = 0.88
    vibrancy = 0.25
    vibrancy_darkness = 0.35
}

# Main clock widget with shadow
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 80
    font_family = $font
    position = 0, 270
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
    shadow_boost = 1.5
}

# Date widget below clock with shadow
label {
    monitor =
    text = cmd[update:43200000] date +"%A, %d %B %Y"
    color = $subtext1
    font_size = 22
    font_family = $font
    position = 0, 360
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.4)
    shadow_boost = 1.5
}


input-field {
    monitor =
    size = 450, 60
    outline_thickness = 3
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(cba6f7ff) rgba(89b4faff) rgba(94e2d5ff) 10deg
    inner_color = $surface0
    font_color = $text
    check_color = $green
    fail_color = $red
    capslock_color = $yellow

    fade_on_empty = false
    fade_timeout = 2000
    placeholder_text = <span foreground="##$overlay1Alpha">Password or get screwed...</span>
    hide_input = false

    position = 0, -50
    halign = center
    valign = center

    font_family = $font Medium

    fail_text = <span foreground="##$redAlpha">Wrong pass, you Ohio skibidi reject</span>

    rounding = 15

    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.45)
    shadow_boost = 1.8
}

# Custom greeting
label {
    monitor =
    text = Sup $USER
    color = $blue
    font_size = 24
    font_family = $font Italic
    position = 0, 25
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 3
    shadow_color = rgba(17, 17, 27, 0.5)
    shadow_boost = 1.5
}

label {
    monitor =
    text = cmd[update:60000] echo "󱑎 Getting pounded for $(uptime -p | sed 's/up //')"
    color = $accent
    font_size = 14
    font_family = $font
    position = 30, 30
    halign = left
    valign = bottom
    shadow_passes = 2
    shadow_size = 2
    shadow_color = rgba(17, 17, 27, 0.4)
    shadow_boost = 1.2
}

label {
    monitor =
    text = cmd[update:30000] BATT=$(cat /sys/class/power_supply/BAT0/capacity); \
        if [ $BATT -le 20 ]; then \
            echo "󰁺 $BATT%"; \
        elif [ $BATT -le 50 ]; then \
            echo "󰁾 $BATT%"; \
        elif [ $BATT -le 80 ]; then \
            echo "󰂀 $BATT%"; \
        else \
            echo "󰁹 $BATT%"; \
        fi
    color = $green
    font_size = 14
    font_family = $font
    position = -30, 30
    halign = right
    valign = bottom
    shadow_passes = 2
    shadow_size = 2
    shadow_color = rgba(17, 17, 27, 0.5)
    shadow_boost = 1.2
}


# System info bar - adjusted position higher from bottom
label {
    monitor =
    text = cmd[update:60000] echo "$(grep "model name" /proc/cpuinfo | head -n 1 | cut -d ":" -f2 | sed 's/^ *//g' | cut -d " " -f1-3) | RAM: $(free -h | awk '/^Mem/ {print $3 "/" $2}')"
    color = $overlay2
    font_size = 12
    font_family = $font
    position = 0, -125
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 2
    shadow_color = rgba(17, 17, 27, 0.4)
    shadow_boost = 1.2
}

