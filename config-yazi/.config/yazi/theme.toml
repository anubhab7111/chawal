# ================================
# YAZI THEME WITH CATPPUCCIN FLAVOR
# ================================

# yazi picks the dark or light flavor from the terminal background.
[flavor]
dark = "catppuccin-mocha"

# ================================
# CUSTOM OVERRIDES
# ================================

# Hovered entry and preview highlight
[indicator]
current = { reversed = true }
preview = { fg = "#89b4fa", underline = true }

# Status bar customization - matching Waybar modules (flat, no round caps)
[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress bar with signature blue
progress_normal = { fg = "#89b4fa", bg = "#313244" }
progress_error  = { fg = "#f38ba8", bg = "#313244" }

# More vibrant mode indicators
[mode]
normal_main = { fg = "#1e1e2e", bg = "#89b4fa", bold = true }
select_main = { fg = "#1e1e2e", bg = "#a6e3a1", bold = true }
unset_main  = { fg = "#1e1e2e", bg = "#f38ba8", bold = true }

# Input styling
[input]
border = { fg = "#89dceb" }

# "Open with" menu styling
[pick]
border = { fg = "#a6e3a1" }
active = { fg = "#1e1e2e", bg = "#a6e3a1", bold = true }

# Tasks styling
[tasks]
border  = { fg = "#89b4fa" }
hovered = { fg = "#1e1e2e", bg = "#fab387" }

# Which menu styling
[which]
cand = { fg = "#89dceb" }

# Completion styling
[cmp]
border = { fg = "#89b4fa" }
active = { reversed = true }
