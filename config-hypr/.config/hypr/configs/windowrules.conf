##############################
### WINDOWS AND WORKSPACES ###
##############################
# ================================
# GENERAL WINDOW RULES
# ================================
windowrule = match:class .*, suppress_event maximize
windowrule = match:class ^(libreoffice.*)$, suppress_event fullscreen

# ================================
# FLOATING WINDOWS
# ================================
windowrule = match:class kitty, float on
windowrule = match:class ^(com.saivert.pwvucontrol)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(qalculate-gtk)$, float on
windowrule = match:class ^(pavucontrol)$, float on

windowrule = match:class ^(xdg-desktop-portal-gtk)$, float on
windowrule = match:title ^(Open File)$, float on
windowrule = match:title ^(Save File)$, float on
windowrule = match:title ^(Open Folder)$, float on
windowrule = match:title ^(Save As)$, float on

windowrule = match:class ^(zenity)$, float on
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:class ^(mpv)$ match:title ^(.*mpv.*)$, float on
windowrule = match:class ^(imv)$, float on

windowrule = match:class ^(polkit-gnome-authentication-agent-1)$, float on
windowrule = match:class ^(org.kde.polkit-kde-authentication-agent-1)$, float on

# ================================
# CENTERED FLOATING WINDOWS
# ================================
windowrule = match:class ^(pavucontrol)$, center on
windowrule = match:class ^(blueman-manager)$, center on
windowrule = match:class ^(qalculate-gtk)$, center on
windowrule = match:class ^(nm-connection-editor)$, center on
windowrule = match:title ^(Open File)$, center on
windowrule = match:title ^(Save File)$, center on

# ================================
# WINDOW SIZES
# ================================
windowrule = match:class ^(pavucontrol)$, size 900 600
windowrule = match:class ^(blueman-manager)$, size 800 500
windowrule = match:class ^(qalculate-gtk)$, size 600 700
windowrule = match:class ^(nm-connection-editor)$, size 700 500

# ================================
# OPACITY SETTINGS
# ================================
windowrule = match:class ^(pavucontrol)$, opacity 0.90 0.85 override
windowrule = match:class ^(blueman-manager)$, opacity 0.90 0.85 override
windowrule = match:class ^(thunar)$, opacity 0.92 0.88 override
windowrule = match:class ^(org.gnome.Nautilus)$, opacity 0.92 0.88 override
windowrule = match:class ^(nemo)$, opacity 0.92 0.88 override

windowrule = match:class ^(Alacritty)$, opacity 0.95 0.90 override
windowrule = match:class ^(kitty)$, opacity 0.95 0.90 override
windowrule = match:class ^(footclient)$, opacity 0.95 0.90 override

windowrule = match:class ^(code-oss)$, opacity 0.98 0.95 override
windowrule = match:class ^(code)$, opacity 0.90 0.90 override
windowrule = match:class ^(dev.zed.Zed)$, opacity 0.90 0.90 override
windowrule = match:class ^(codium)$, opacity 0.98 0.95 override
windowrule = match:class ^(Cursor)$, opacity 0.98 0.95 override
windowrule = match:class ^(Cursor)$, opacity 0.7 0.95 override

windowrule = match:class ^(discord)$, opacity 0.96 0.92 override
windowrule = match:class ^(vesktop)$, opacity 0.96 0.92 override
windowrule = match:class ^(com.rtosta.zapzap)$, opacity 0.96 0.92 override
windowrule = match:class ^(Signal)$, opacity 0.96 0.92 override

windowrule = match:class ^(firefox)$, opacity 1.00 1.00 override
windowrule = match:class ^(steam_app_default)$, opacity 1.00 1.00 override
windowrule = match:class ^(µVision)$, opacity 1.00 1.00 override


# ================================
# BLUR SETTINGS
# ================================
windowrule = match:class ^(firefox)$, no_blur on
windowrule = match:class ^(chromium)$, no_blur on
windowrule = match:class ^(brave-browser)$, no_blur on
windowrule = match:class ^(librewolf)$, no_blur on
windowrule = match:class ^(steam)$, no_blur on
windowrule = match:class ^(Steam)$, no_blur on
windowrule = match:title ^(.*Steam[A-Za-z0-9\s]*)$, no_blur on

windowrule = match:class ^(mpv)$, no_blur on
windowrule = match:class ^(vlc)$, no_blur on
windowrule = match:class ^(spotify)$, no_blur on
windowrule = match:class ^(Spotify)$, no_blur on

# windowrule = match:class ^(steam_app_.*)$, no_blur on
windowrule = match:class ^(gamescope)$, no_blur on

# ================================
# IDLEINHIBIT
# ================================
windowrule = match:class ^(mpv)$, idle_inhibit focus
windowrule = match:class ^(vlc)$, idle_inhibit focus
windowrule = match:class ^(firefox)$, idle_inhibit fullscreen
windowrule = match:class ^(chromium)$, idle_inhibit fullscreen
windowrule = match:class ^(steam_app_.*)$, idle_inhibit always

# # ================================
# # WORKSPACE ASSIGNMENTS
# # ================================
# windowrule = match:class ^(Alacritty)$, workspace 1
# windowrule = match:class ^(kitty)$, workspace 1
# windowrule = match:class ^(firefox)$, workspace 2
# windowrule = match:class ^(chromium)$, workspace 2
# windowrule = match:class ^(brave-browser)$, workspace 2
# windowrule = match:class ^(code-oss)$, workspace 3
# windowrule = match:class ^(Code)$, workspace 3
#
# windowrule = match:class ^(discord)$, workspace 4 silent
# windowrule = match:class ^(vesktop)$, workspace 4 silent
# windowrule = match:class ^(Signal)$, workspace 4 silent
# windowrule = match:class ^(com.rtosta.zapzap)$, workspace 4 silent
#
# windowrule = match:class ^(spotify)$, workspace 5 silent
# windowrule = match:class ^(Spotify)$, workspace 5 silent

# ================================
# LAYER RULES
# ================================
layerrule = match:namespace wofi, animation popin 90%
layerrule = match:namespace wofi, animation slide down
layerrule = match:namespace wofi, animation popin 80%
layerrule = match:namespace wofi, dim_around on

layerrule = match:namespace mako, blur on
layerrule = match:namespace mako, animation slide right

layerrule = match:namespace swaync-notification-window, blur on
layerrule = match:namespace swaync-notification-window, animation slide right
layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-control-center, animation slide right

# Volume edge-hover slider: no blur (own namespace, so it doesn't inherit
# the blanket gtk-layer-shell blur rule below -- with ignore_opacity/
# popups_ignorealpha on, that blur was rendering through the widget's
# transparent margins as a visible blurred box). It does get a real
# slide-in animation instead of just appearing, same slide-from-the-right
# treatment as mako/swaync above.
layerrule = match:namespace volume-panel, animation slide right

# layerrule = match:namespace waybar, blur on
layerrule = match:namespace gtk-layer-shell, blur on
layerrule = match:namespace hyprpaper, no_anim on
layerrule = match:namespace selection, no_anim on
layerrule = match:namespace logout_dialog, blur on


# ================================
# SPECIAL ANIMATIONS
# ================================
windowrule = match:class ^(thunar)$, animation slide
windowrule = match:class ^(org.gnome.Nautilus)$, animation slide

windowrule = match:class ^(pavucontrol)$, animation popin 80%
windowrule = match:class ^(blueman-manager)$, animation popin 80%
windowrule = match:class ^(qalculate-gtk)$, animation popin 80%

windowrule = match:title ^(Picture-in-Picture)$, animation fade

# ================================
# TILING EXCEPTIONS
# ================================
windowrule = match:class ^(Spotify)$, tile on
windowrule = match:class ^(discord)$, tile on

# ================================
# WINDOW BORDERS
# ================================
windowrule = match:class ^(firefox) match:fullscreen 1, border_size 0
windowrule = match:class ^(chromium) match:fullscreen 1, border_size 0
windowrule = match:class ^(mpv) match:fullscreen 1, border_size 0
windowrule = match:class ^(steam_app_.*)$, border_size 0

windowrule = match:class ^(firefox)$, border_color rgb($redAlpha)
windowrule = match:class ^(code-oss)$, border_color rgb($blueAlpha)
windowrule = match:class ^(thunar)$, border_color rgb($greenAlpha)
windowrule = match:class ^(discord)$, border_color rgb($peachAlpha)

# ================================
# PINNING & SPECIAL BEHAVIORS
# ================================
windowrule = match:title ^(Picture-in-Picture)$, pin on
windowrule = match:class ^(mpv) match:title ^(.*mpv.*)$, pin on

windowrule = match:class ^(steam)$, no_initial_focus on
windowrule = match:class ^(spotify)$, no_initial_focus on

windowrule = match:class ^(steam_app_.*)$, immediate on
windowrule = match:class ^(cs2)$, immediate on

# ================================
# XWAYLAND APPS
# ================================
windowrule = match:xwayland 1, rounding 12
windowrule = match:xwayland 1, opacity 0.95 0.90 override

# ================================
# WORKSPACE RULES
# ================================
workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = special:music, on-created-empty:spotify
workspace = special:term, on-created-empty:alacritty
