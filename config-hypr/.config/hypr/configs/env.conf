#############################
### ENVIRONMENT VARIABLES ###
#############################
# See https://wiki.hyprland.org/Configuring/Environment-variables/

# Desktop Environment
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

# Qt Configuration
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt5ct

# Cursor Configuration
# env = XCURSOR_THEME,catppuccin-macchiato-peach-cursors
# env = XCURSOR_SIZE,30
env = HYPRCURSOR_THEME,HyprBibataModernClassicSVG
env = HYPRCURSOR_SIZE,34

# NVIDIA Specific
# env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card2
# env = GBM_BACKEND,nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = __GL_GSYNC_ALLOWED,1
# env = LIBVA_DRIVER_NAME,nvidia

# Intel GPU Prioritized (NVIDIA GPU kept free)
# env = AQ_DRM_DEVICES,/dev/dri/card2:/dev/dri/card1
env = AQ_DRM_DEVICES,/dev/dri/card2
env = GBM_BACKEND,i915
env = __GLX_VENDOR_LIBRARY_NAME,mesa
env = LIBVA_DRIVER_NAME,iHD
env = vblank_mode,0
env = __GL_SYNC_TO_VBLANK,0

# Application Specific
env = HYPRSHOT_DIR,/home/ushtro/Pictures/Screenshots/

# debug{
#   disable_logs = false
