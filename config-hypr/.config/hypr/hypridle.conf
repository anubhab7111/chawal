# Idle timeline: keyboard backlight off 2.5 min, dim 4 min, lock 5 min,
# screen off 5.5 min, suspend 30 min. The same on AC and battery.
#
# Every listener asks `rice-idle quiet` first: while audio is playing it
# defers and re-checks every 30 s, so music or a call never gets dimmed,
# locked or suspended. Caffeine (rice-caffeine, Waybar) holds a systemd idle
# inhibitor, which pauses all of this.

general {
    lock_cmd = pidof hyprlock || hyprlock       # one hyprlock at a time
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # no double key press to wake the screen
    inhibit_sleep = 3                           # hold suspend until the lock screen is up
}

listener {
    timeout = 150
    condition_cmd = ~/.config/rice/bin/rice-idle quiet
    condition_retry = 30
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0   # keyboard backlight off
    on-resume = brightnessctl -rd rgb:kbd_backlight
}

listener {
    timeout = 240
    condition_cmd = ~/.config/rice/bin/rice-idle quiet
    condition_retry = 30
    on-timeout = ~/.config/rice/bin/rice-idle dim     # to min(current, 30%); never brightens
    on-resume = ~/.config/rice/bin/rice-idle undim
}

listener {
    timeout = 300
    condition_cmd = ~/.config/rice/bin/rice-idle quiet
    condition_retry = 30
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    condition_cmd = ~/.config/rice/bin/rice-idle quiet
    condition_retry = 30
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && ~/.config/rice/bin/rice-idle undim
}

listener {
    timeout = 1800
    condition_cmd = ~/.config/rice/bin/rice-idle quiet
    condition_retry = 30
    on-timeout = systemctl suspend
}
