# Baseline hyprlock wording (unchanged from what the lock screen has always said).
# Split around $USER (rather than embedding $USER inside these vars) since
# $USER is only proven to resolve when used directly in a hyprlock.conf
# property, not when nested inside another variable's own definition.
$lockGreetingPrefix = Sup
$lockGreetingSuffix =
$lockPlaceholder = Password or get screwed...
$lockFailText = Wrong pass, you Ohio skibidi reject
$lockUptimeCmd = echo "󱑎 Getting pounded for $(uptime -p | sed 's/up //')"
