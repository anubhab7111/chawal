# Derived vars used directly by decorations.conf / hyprlock.conf
# "Velvet Pulse" border: crimson -> gild -> rose, a 3-stop gradient (was a
# 2-tone crimson/rose back-and-forth). The existing borderangle rotation
# animation now sweeps a muted rose-gold glint through as a transitional
# stop between crimson and rose, not a dominant color - the gild accent's
# only role is trim, matching the eww bar's gild hairline. hyprlock's
# input-field outer_color reads these same vars, so this one edit updates
# both the Hyprland window border and the lock-screen ring together.
$borderActive1 = ff4d6dff
$borderActive2 = d9a86cff
$borderActive3 = ff8fa3ff
$borderInactive = ff3a1d2b
$bgColor = 1a0e14
