# petabyte per-theme Hyprland overrides.
# Sourced AFTER configs/decorations.conf in hyprland.conf, so these keywords win.
# Gives petabyte a distinct, sultry, "breathing glow" identity vs the baseline themes.

general {
    # Cinematic breathing room
    gaps_in = 12
    gaps_out = 28
    border_size = 3
}

decoration {
    rounding = 18
    # Slightly deeper, softer glass for the boudoir mood
    blur {
        enabled = true
        size = 10
        passes = 3
        vibrancy = 0.30
        brightness = 0.85
    }
}

# Sultry animation curves + a continuously rotating gradient border ("breathing"
# crimson/rose glow). petabyte's col.active_border gradient is defined in
# hyprland-colors.conf (borderActive1/2/3), so the loop below animates that gradient.
animations {
    enabled = true

    bezier = petabyteEase, 0.16, 1, 0.30, 1
    bezier = petabyteSway, 0.45, 0, 0.15, 1

    animation = windowsIn, 1, 6, petabyteEase, popin 92%
    animation = windowsOut, 1, 5, petabyteSway, popin 90%
    animation = windowsMove, 1, 6, petabyteEase, slide
    animation = fadeIn, 1, 5, petabyteEase
    animation = fadeOut, 1, 5, petabyteEase

    # The signature: slowly rotate the active-border gradient forever.
    animation = borderangle, 1, 120, linear, loop
    animation = border, 1, 12, petabyteEase

    animation = workspaces, 1, 7, petabyteEase, slide
    animation = specialWorkspace, 1, 7, petabyteEase, slidevert
}
