active_tab_background   #ff4d6d
inactive_tab_foreground #f5dde3
inactive_tab_background #150b10
tab_bar_background      #100810

# Colors for marks (marked text in the terminal)
mark1_foreground #1a0e14
mark1_background #c9a8e0
mark2_foreground #1a0e14
mark2_background #ff4d6d
mark3_foreground #1a0e14
mark3_background #6fb4d1

