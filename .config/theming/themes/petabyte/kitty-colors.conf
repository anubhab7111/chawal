# vim:ft=kitty
## name:     Petabyte
## blurb:    Dark crimson/rose theme

# The basic colors
foreground              #f5dde3
background              #1a0e14
selection_foreground    #1a0e14
selection_background    #ffd9e0

# Cursor colors
cursor                  #ffd9e0
cursor_text_color       #1a0e14

# URL underline color when hovering with mouse
url_color               #ffd9e0

# Kitty window border colors
active_border_color     #c9a8e0
inactive_border_color   #6b2f43
bell_border_color       #f2b6a0

# Tab bar colors
