# ================================
# FONT CONFIGURATION
# ================================
font=JetBrainsMono Nerd Font 13
markup=1

# ================================
# GLOBAL CONFIG
# ================================
max-history=50
sort=-time
layer=overlay
anchor=top-right

# ================================
# BINDING OPTIONS
# ================================
on-button-middle=exec makoctl menu -n "$id" dmenu -p 'Select action: '
on-button-right=dismiss
on-touch=dismiss
on-notify=exec mpv /usr/share/sounds/freedesktop/stereo/message.oga

# ================================
# STYLE OPTIONS
# ================================
# Dimensions & Spacing
width=400
height=120
margin=12
padding=16,20
icon-location=left
max-icon-size=48

# Visibility & Behavior
default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name

# ================================
# COLORS & APPEARANCE
# ================================
background-color=#313244f2
text-color=#cdd6f4
border-color=#89b4fa
border-size=3
border-radius=16
icon-path=/usr/share/icons/Papirus-Dark

# Progress bar styling
progress-color=over #89b4fa

# ================================
# EFFECTS & ANIMATIONS
# ================================
# Note: Mako doesn't support blur natively, but compositor handles it

# ================================
# URGENCY LEVELS
# ================================
[urgency=low]
border-color=#94e2d5
background-color=#313244f2
default-timeout=3000

[urgency=normal]
border-color=#89b4fa
background-color=#313244f2
default-timeout=5000

[urgency=high]
border-color=#f38ba8
background-color=#313244f2
text-color=#f38ba8
default-timeout=0

[urgency=critical]
border-color=#f38ba8
background-color=#1e1e2ef2
text-color=#f38ba8
default-timeout=0
border-size=4

# ================================
# APP-SPECIFIC OVERRIDES
# ================================
[app-name="Spotify"]
border-color=#a6e3a1
icon-path=/usr/share/icons/Papirus-Dark

[app-name="Volume" app-name="Brightness"]
border-color=#fab387
default-timeout=2000
group-by=none

[app-name="Network"]
border-color=#cba6f7

[app-name="Battery"]
border-color=#a6e3a1

[app-name="screenshot"]
border-color=#89dceb
default-timeout=2000
