# ================================
# YAZI GENERAL CONFIGURATION
# Matching Waybar UI/UX Behavior
# ================================

# ================================
# MANAGER SETTINGS
# ================================
[manager]
# Layout configuration
ratio = [1, 4, 3]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = false
linemode = "size"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll"]
title_format = "Yazi: {cwd}"

# ================================
# PREVIEW SETTINGS
# ================================
[preview]
tab_size = 2
max_width = 1000
max_height = 900
cache_dir = ""
image_filter = "lanczos3"
image_quality = 90
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

# ================================
# OPENER SETTINGS
# ================================
[opener]
# Text files
edit = [
	{ run = 'nvim "$@"', block = true, for = "unix" },
	{ run = 'code "%*"', orphan = true, for = "windows" },
]

# Images
open_image = [
	{ run = 'imv "$@"', orphan = true, for = "unix" },
	{ run = 'feh "$@"', orphan = true, for = "unix" },
]

# Videos
play = [
	{ run = 'mpv "$@"', orphan = true, for = "unix" },
	{ run = 'vlc "%*"', orphan = true, for = "windows" },
]

# PDFs
open_pdf = [
	{ run = 'okular "$@"', orphan = true, for = "unix" },
	{ run = 'evince "$@"', orphan = true, for = "unix" },
]

# Archives
extract = [
	{ run = 'unar "$@"', desc = "Extract here" },
	{ run = '7z x "$@"', desc = "Extract with 7z" },
]

# Directories
open_dir = [
	{ run = '$SHELL', block = true, desc = "Open shell here" },
]

# Presentations
# open_ppt = [
#     { run = 'libreoffice --impress "$@"', orphan = true, for = "unix" },
# ]
open_ppt = [
    { run = 'libreoffice --impress "$@"', orphan = true, for = "unix" },
]


# ================================
# OPEN RULES
# ================================
[open]
rules = [
	# Images
	{ mime = "image/*", use = "open_image" },

	# Videos
	{ mime = "video/*", use = "play" },
	{ mime = "audio/*", use = "play" },

	# Text files
	{ mime = "text/*", use = "edit" },
	{ mime = "application/json", use = "edit" },
	{ mime = "application/toml", use = "edit" },
	{ mime = "application/xml", use = "edit" },

  # PPTX (modern PowerPoint)
  { mime = "application/vnd.openxmlformats-officedocument.presentationml.presentation", use = "open_ppt" },

  # Legacy PPT (optional but smart)
  { mime = "application/vnd.ms-powerpoint", use = "open_ppt" },
  { mime = "application/pptx", use = "open_ppt" },


	# PDFs
	{ mime = "application/pdf", use = "open_pdf" },

	# Archives
	{ mime = "application/*zip", use = "extract" },
	{ mime = "application/*tar", use = "extract" },
	{ mime = "application/*rar", use = "extract" },

	# Directories
	{ mime = "inode/directory", use = "open_dir" },

	# Fallback
	{ mime = "*", use = "edit" },

  { name = "*.{png,jpg,jpeg}", use = [ "image_roll", "reveal" ] },
  { name = "*.heic", use = [ "feh_opener", "reveal" ] },
]

# ================================
# TASKS SETTINGS
# ================================
[tasks]
micro_workers = 10
macro_workers = 25
bizarre_retry = 5
image_alloc = 536870912  # 512MB
image_bound = [0, 0]
suppress_preload = false

# ================================
# PLUGIN SETTINGS
# ================================
[plugin]

# Preloaders
preloaders = [
	{ mime = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
	{ mime = "image/*", run = "image" },
	{ mime = "video/*", run = "video" },
	{ mime = "application/pdf", run = "pdf" },
	{ mime = "application/json", run = "json" },
]

# Previewers
previewers = [
	{ mime = "text/*", run = "code" },
	{ mime = "*/xml", run = "code" },
	{ mime = "*/javascript", run = "code" },
	{ mime = "*/x-wine-extension-ini", run = "code" },
	{ mime = "application/{json,x-ndjson}", run = "json" },
	{ mime = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
	{ mime = "image/*", run = "image" },
	{ mime = "video/*", run = "video" },
	{ mime = "application/pdf", run = "pdf" },
	{ mime = "inode/directory", run = "folder" },
]

# ================================
# INPUT SETTINGS
# ================================
[input]
# cd
cd_title = "Change directory:"
cd_origin = "top-center"
cd_offset = [0, 2, 50, 3]

# create - Fixed: must be array of 2 strings [file_title, dir_title]
create_title = ["Create file:", "Create directory:"]
create_origin = "top-center"
create_offset = [0, 2, 50, 3]

# rename
rename_title = "Rename:"
rename_origin = "hovered"
rename_offset = [0, 1, 50, 3]

# trash
trash_title = "Move {n} selected file{s} to trash? (y/N)"
trash_origin = "top-center"
trash_offset = [0, 2, 50, 3]

# delete
delete_title = "Delete {n} selected file{s} permanently? (y/N)"
delete_origin = "top-center"
delete_offset = [0, 2, 50, 3]

# find
find_title = ["Find next:", "Find previous:"]
find_origin = "top-center"
find_offset = [0, 2, 50, 3]

# filter
filter_title = "Filter:"
filter_origin = "top-center"
filter_offset = [0, 2, 50, 3]

# search
search_title = "Search via {n}:"
search_origin = "top-center"
search_offset = [0, 2, 50, 3]

# shell
shell_title = ["Shell:", "Shell (block):"]
shell_origin = "top-center"
shell_offset = [0, 2, 50, 3]

# ================================
# SELECT SETTINGS
# ================================
[select]
open_title = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 7]

# ================================
# LOG SETTINGS
# ================================
[log]
enabled = false

