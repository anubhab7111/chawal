#################
### AUTOSTART ###
#################

# ================================
# SYSTEM SERVICES & ENVIRONMENT
# ================================
exec-once = systemctl --user start pipewire
exec-once = systemctl --user start plasma-polkit-agent
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY



# ================================
# WALLPAPER & THEMING
# ================================
exec-once = awww-daemon
# Wallpaper, waybar-vs-eww-dock, the screen shader, and cava/btop/rofi/GTK-icon
# theming are all runtime state that only apply-theme.sh sets — replay the
# last active theme on every login so it doesn't silently reset to defaults.
# (kitty/alacritty/mako pick up their colors on their own via the
# theming/current symlink, no replay needed for those.)
exec-once = bash -c 'sleep 1; ~/.config/theming/apply-theme.sh "$(cat ~/.config/theming/state 2>/dev/null || echo catppuccin)"'

# ================================
# CURSOR THEME
# ================================
exec-once = hyprctl setcursor HyprBibataModernClassicSVG 30
# exec = hyprctl setcursor catppuccin-macchiato-peach-cursors 30

# ================================
# UI COMPONENTS
# ================================
# exec-once = hyprpm reload
exec-once = hypridle
exec-once = mako
# waybar (or the eww dock in its place) is started by the theme-replay line
# above, per whichever theme was last active — not unconditionally here.

# ================================
# SYSTEM TRAY APPLETS
# ================================
exec-once = nm-applet & blueman-applet
exec-once = udiskie

# ================================
# CLIPBOARD MANAGEMENT
# ================================
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ================================
# OTHER UTILITIES
# ================================
