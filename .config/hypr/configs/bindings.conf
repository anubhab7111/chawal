### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = alacritty
$fileManager = thunar
$menu = wofi --show drun
$code = vscodium
$browser = firefox

####################
### KEYBINDINGS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$mod = CTRL

# ================================
# SYSTEM CONTROLS
# ================================
bind = $mainMod, M, exit,           # Exit Hyprland
bind = $mainMod, L, exec, hyprlock  # Lock screen
bind = $mainMod, F1, exec, ~/.config/hypr/scripts/gamemode.sh
bind = $mainMod, escape, exec, wlogout

# ================================
# APPLICATION SHORTCUTS
# ================================
bind = $mainMod, Q, exec, $terminal      # Terminal
bind = $mainMod SHIFT, Q, exec, kitty
bind = $mainMod, E, exec, $fileManager   # File manager
bind = $mainMod, SPACE, exec, $menu      # App launcher
bind = $mainMod SHIFT, C, exec, $code    # Code editor
bind = $mainMod, B, exec, $browser       # Default browser
bind = $mainMod SHIFT, B, exec, chromium # Chromium
bind = $mainMod, Z, exec, zapzap         # ZapZap
bind = $mainMod, A, exec, pwvucontrol    # Audio control
# bind = $mainMod, D, exec, discord      # Discord

# ================================
# WINDOW MANAGEMENT
# ================================
bind = $mainMod, C, killactive,      # Close window
bind = $mainMod, V, togglefloating,  # Toggle floating
bind = $mainMod, F, fullscreen, 1    # Fullscreen (keep bar)
bind = $mainMod SHIFT, F, fullscreen # Fullscreen (no bar)
bind = $mainMod, P, pseudo,          # Pseudotile (dwindle)
# bind = $mainMod, J, togglesplit,     # Toggle split (dwindle)

# ================================
# WINDOW FOCUS (ARROW KEYS)
# ================================
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ================================
# WINDOW MOVEMENT (SHIFT + ARROW KEYS)
# ================================
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# ================================
# WORKSPACE SWITCHING
# ================================
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ================================
# MOVE WINDOW TO WORKSPACE
# ================================
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ================================
# SPECIAL WORKSPACE (SCRATCHPAD)
# ================================
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# ================================
# MOUSE BINDINGS
# ================================
bind = $mainMod, mouse_down, workspace, e+1# Scroll through workspaces
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow    # Move window with LMB
bindm = $mainMod, mouse:273, resizewindow  # Resize window with RMB

# ================================
# RESIZE MODE
# ================================
bind = $mainMod, R, submap, resize                                 # Enter resize mode

submap = resize
# Arrow keys
bind = , left, resizeactive, -20 0
bind = , right, resizeactive, 20 0
bind = , up, resizeactive, 0 -20
bind = , down, resizeactive, 0 20

# Vim-style keys
bind = , h, resizeactive, -20 0
bind = , l, resizeactive, 20 0
bind = , k, resizeactive, 0 -20
bind = , j, resizeactive, 0 20

# Exit resize mode
bind = , escape, submap, reset
bind = , R, submap, reset
submap = reset

# ================================
# MEDIA CONTROLS
# ================================
bind = , XF86AudioRaiseVolume, exec, pamixer --allow-boost -i 5                  # Volume up
bind = , XF86AudioLowerVolume, exec, pamixer --allow-boost -d 5                  # Volume down
bind = , XF86AudioMute, exec, pamixer -t                           # Mute toggle
bind = , XF86AudioPlay, exec, playerctl play-pause                 # Play/pause
bind = , XF86AudioPause, exec, playerctl play-pause               # Play/pause
bind = , XF86AudioNext, exec, playerctl next                       # Next track
bind = , XF86AudioPrev, exec, playerctl previous                   # Previous track

# ================================
# BRIGHTNESS CONTROLS
# ================================
bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%            # Brightness up
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-          # Brightness down
bindl = , XF86MonBrightnessUp, exec, brightnessctl set +5%         # Alternative brightness up
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-       # Alternative brightness down

# ================================
# SCREENSHOTS
# ================================
bind = $mainMod, PRINT, exec, hyprshot -m window                   # Screenshot window
bind = , PRINT, exec, hyprshot -m output                           # Screenshot monitor
bind = $shiftMod, PRINT, exec, hyprshot -m region                  # Screenshot region

# ================================
# UTILITIES
# ================================
bind = SUPER SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy # Clipboard history
bind = SUPER SHIFT, N, exec, ~/.config/theming/toggle-theme.sh                     # Cycle theme (catppuccin/green/petabyte)
# bind = $mainMod, W, exec, ~/.config/swww/rand_wall.sh              # Random wallpaper

# ================================
# ZOOM
# ================================
bind = $mainMod, equal, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')
binde = $mainMod, minus, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')
binde = $mainMod, KP_ADD, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')
binde = $mainMod, KP_SUBTRACT, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')

bind = $mainMod SHIFT, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = $mainMod SHIFT, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = $mainMod SHIFT, minus, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = $mainMod SHIFT, KP_SUBTRACT, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = $mainMod SHIFT, 0, exec, hyprctl -q keyword cursor:zoom_factor 1

# bind = $mainMod,Tab, hyprexpo:expo, toggle


# ================================
# GESTURES
# ================================
# gesture = 2, pinch, resize
gesture = 3, horizontal, workspace
gesture = 3, up, float
gesture = 4, down, close
gesture = 4, up, fullscreen


