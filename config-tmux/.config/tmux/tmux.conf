# Terminal: tmux's own terminfo inside tmux, and tell tmux that the outer
# alacritty supports truecolour and sixel images.
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB:sixel"

# Измените префиксную клавишу с 'Ctrl-b' на 'Ctrl-a'
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Разрешите прокрутку мышью
set -g mouse on

# Native Catppuccin bar, no plugin. Colours come from mocha.conf next to this
# file; `set -F` bakes them into the style options when the config loads.
source-file -F "#{d:current_file}/mocha.conf"

set -g status-justify left
set -g status-left ""
set -g status-right-length 100
set -gF status-style "bg=#{@thm_base},fg=#{@thm_text}"
set -gF message-style "bg=#{@thm_surface0},fg=#{@thm_text}"
set -gF message-command-style "bg=#{@thm_surface0},fg=#{@thm_text}"
set -gF mode-style "bg=#{@thm_surface1},fg=#{@thm_text}"
set -gF pane-border-style "fg=#{@thm_surface0}"
set -gF pane-active-border-style "fg=#{@thm_blue}"

# Window pills: name, then the window number in the accent colour.
set -g window-status-separator " "
set -g window-status-format "#[fg=#{@thm_surface0},bg=#{@thm_base}]#[fg=#{@thm_subtext0},bg=#{@thm_surface0}]#W #[fg=#{@thm_crust},bg=#{@thm_overlay0}] #I#[fg=#{@thm_overlay0},bg=#{@thm_base}]"
set -g window-status-current-format "#[fg=#{@thm_surface0},bg=#{@thm_base}]#[fg=#{@thm_text},bg=#{@thm_surface0},bold]#W #[fg=#{@thm_crust},bg=#{@thm_mauve}] #I#[fg=#{@thm_mauve},bg=#{@thm_base}]"

# Right side: directory, user@host and session pills (accent icon + text).
set -g status-right "\
#[fg=#{@thm_blue},bg=#{@thm_base}] #[fg=#{@thm_crust},bg=#{@thm_blue}] #[fg=#{@thm_text},bg=#{@thm_surface0}] #{=/-32/…:#{s|^$HOME|~|:pane_current_path}}#[fg=#{@thm_surface0},bg=#{@thm_base}]\
#[fg=#{@thm_peach},bg=#{@thm_base}] #[fg=#{@thm_crust},bg=#{@thm_peach}] #[fg=#{@thm_text},bg=#{@thm_surface0}] #{user}@#H#[fg=#{@thm_surface0},bg=#{@thm_base}]\
#[fg=#{@thm_green},bg=#{@thm_base}] #[fg=#{@thm_crust},bg=#{@thm_green}] #[fg=#{@thm_text},bg=#{@thm_surface0}] #S#[fg=#{@thm_surface0},bg=#{@thm_base}]"
